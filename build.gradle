plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.13.1'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

group = 'xyz.zono'
version = '1.0.0'

kotlin {
    jvmToolchain(17)
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2023.2')
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

// See https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
intellijPlatform {
    pluginConfiguration {
        id = 'xyz.zono.plugin.InputSequenceAction'
        name = 'InputSequence'
        vendor {
            name = 'isann'
        }
        ideaVersion {
            sinceBuild = '232'
        }
        changeNotes = """
      <em>Update compatible versions and migrate to IntelliJ Platform Gradle Plugin.</em>"""
    }

    pluginVerification {
        ides {
            recommended()
        }
    }
}
test {
    useJUnitPlatform()
}
